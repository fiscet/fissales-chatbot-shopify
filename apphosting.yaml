runConfig:
  runtime: nodejs18
  env:
    - variable: NODE_ENV
      value: production
    - variable: SHOPIFY_API_KEY
      secret: SHOPIFY_API_KEY
      availability:
        - BUILD
        - RUNTIME
    - variable: SHOPIFY_API_SECRET
      secret: SHOPIFY_API_SECRET
      availability:
        - BUILD
        - RUNTIME
    - variable: SHOPIFY_APP_URL
      secret: SHOPIFY_APP_URL
      availability:
        - BUILD
        - RUNTIME
    - variable: SHOPIFY_SCOPES
      secret: SHOPIFY_SCOPES
      availability:
        - BUILD
        - RUNTIME
    - variable: FIREBASE_PROJECT_ID
      secret: FIREBASE_PROJECT_ID
      availability:
        - BUILD
        - RUNTIME