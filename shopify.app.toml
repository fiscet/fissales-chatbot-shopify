name = "Fissales Chatbot"
client_id = "be1390d3612db28f0d704595a4ca17b6"
application_url = "https://fissales-chatbot-shopify--fissales-chatbot.europe-west4.hosted.app"
embedded = true

[access_scopes]
scopes = "read_products,read_orders,read_customers,write_products,read_metafields,write_metafields"

[auth]
redirect_urls = [
  "https://fissales-chatbot-shopify--fissales-chatbot.europe-west4.hosted.app/auth/callback",
  "https://fissales-chatbot-shopify--fissales-chatbot.europe-west4.hosted.app/auth/install"
]

[webhooks]
api_version = "2024-01"

[[webhooks.subscriptions]]
topics = ["products/update", "products/create", "products/delete"]
uri = "/webhooks/products"

[[webhooks.subscriptions]]
topics = ["orders/paid", "orders/fulfilled", "orders/cancelled"]
uri = "/webhooks/orders"

[[webhooks.subscriptions]]
topics = ["customers/create", "customers/update"]
uri = "/webhooks/customers"

[pos]
embedded = false

[build]
automatically_update_urls_on_dev = true
dev_store_url = "your-dev-store.myshopify.com"
include_config_on_deploy = true

[[extensions]]
type = "theme"
name = "chatbot"
