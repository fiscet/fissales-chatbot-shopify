version: '3.8'

services:
  fissales-customer-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-}  # Optional: pass custom version, defaults to package.json version
    ports:
      - "3001:3000"
    environment:
      - SHOPIFY_APP_URL=${SHOPIFY_APP_URL}
      - SHOPIFY_API_KEY=${SHOPIFY_API_KEY}
      - SHOPIFY_API_SECRET=${SHOPIFY_API_SECRET}
    restart: unless-stopped
